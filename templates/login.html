{% extends 'base.html' %}{% from 'base.html' import token %}{% block content %}
<section class="panel narrow">
  <h1>Analyst login</h1>
  <form method="post">
    {{token(csrf)}}<label
      >Username<input name="username" autocomplete="username" required /></label
    ><label
      >Password<input
        type="password"
        name="password"
        autocomplete="current-password"
        required /></label
    ><button>Sign in</button>
  </form>
</section>
{% endblock %}
