{% extends 'base.html' %}{% from 'base.html' import token %}{% block content %}<a href="/">Back to MIP board</a><section class="panel"><h1>Create case</h1><p class="muted">A unique MARE case number will be assigned when you create the case.</p><form method="post" action="/cases">{{token(csrf)}}<label>Case name<input name="name" maxlength="200" required value="{{values.get('name','')}}" autofocus></label><label>Description<textarea name="description" rows="4">{{values.get('description','')}}</textarea></label><div class="columns"><label>External system (optional)<select name="external_system"><option value="">None</option>{% for system in ['Vortex','XSIAM','JIRA'] %}<option {{'selected' if values.get('external_system')==system else ''}}>{{system}}</option>{% endfor %}</select></label><label>External case number (optional)<input name="external_number" maxlength="200" placeholder="e.g. MARE-123" value="{{values.get('external_number','')}}"></label></div>{% set selected_owner=values.get('owner_id','') %}<label>Assigned owner (optional)<select name="owner_id"><option value="">Unassigned</option>{% for person in active_users %}<option value="{{person.id}}" {{'selected' if selected_owner|string==person.id|string else ''}}>{{person.username}}</option>{% endfor %}</select></label><button>Create case & MIP</button> <a href="/">Cancel</a></form></section>{% endblock %}
