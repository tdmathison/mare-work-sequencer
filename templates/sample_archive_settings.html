<section class="panel sample-password-panel">
  <h2>Sample archive protection</h2>
  <p class="muted">
    Sample uploads are stored as AES-encrypted ZIP files. The password change
    applies to future uploads; existing archives keep their original password.
  </p>
  <form method="post" action="/account/sample-password">
    <input type="hidden" name="csrf" value="{{csrf}}" /><label
      >Sample archive password<input
        type="text"
        name="sample_archive_password"
        value="{{sample_archive_password}}"
        required
        maxlength="256"
        autocomplete="off" /></label
    ><button>Save sample archive password</button>
  </form>
</section>
