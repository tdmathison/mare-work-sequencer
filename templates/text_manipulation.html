<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Manipulation — MARE</title><link rel="stylesheet" href="{{url_for('static',filename='mare.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='text-manipulation.css')}}"><script defer src="{{url_for('static',filename='vendor/codemirror/markdown-editor.js')}}"></script><script defer src="{{url_for('static',filename='text-command-palette.js')}}"></script></head>
<body class="text-tool-body"><main data-text-tool data-user-preferences="{{user.user_uuid}}" data-csrf="{{csrf}}" data-endpoint="{{url_for('tools_text_process')}}" data-worker="{{url_for('static',filename='text-worker.js')}}">
<aside class="text-commands" aria-label="Text commands">
{% include 'components/text_commands.html' %}
</aside><section class="text-editor-column" aria-label="Text workspace"><div class="text-editor-toolbar"><button type="button" data-action="clear">Clear</button><button type="button" data-action="copy">Copy All</button><button type="button" data-action="undo" disabled>Undo</button><button type="button" data-action="redo" disabled>Redo</button><label><input type="checkbox" data-wrap checked> Word Wrap</label><small data-counts></small></div><div data-text-editor></div><div role="status" class="text-status" aria-live="polite">Paste text and choose a command. IOC/IP and formatting commands process on this MARE server; other operations stay in your browser.</div></section>
</main></body></html>
