{% extends 'base.html' %}{% block content %}<h1>Workbench</h1><p class="muted">Choose a case to continue its existing analysis workspace.</p><form method="get"><label>Find a case <input name="q" value="{{query}}" placeholder="Case number or title"></label><button>Search</button></form><div class="panel">{% for case in cases %}<p><a href="{{url_for('detail',cid=case.id)}}">{{case.number}}</a> · {{case.name}}</p>{% else %}<p>No accessible cases match this search.</p>{% endfor %}</div>{% endblock %}
