[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mws-sdk"
version = "1.0.0"
description = "Typed synchronous and asynchronous REST SDK for MARE Work Sequencer"
readme = "sdk/README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["sdk"]
include = ["mws_sdk*"]

[tool.setuptools.package-data]
mws_sdk = ["py.typed", "openapi.json", "operations.json"]

